# Apache — nexusqa.exelixitech.com (srv001qa · 192.168.8.121)
#
# Síntoma: ERR_TOO_MANY_REDIRECTS en /formulario/, /ocr/, /pagos/
# Causa: ProxyPass que quita el prefijo (5182/ en vez de 5182/formulario/)
#
# Instalación (requiere sudo):
#   sudo cp apache-nexusqa-modulos.conf /etc/apache2/sites-available/
#   # Insertar el fragmento en el VirtualHost :443 de nexusqa
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Verificación (debe ser HTTP/1.1 200 — NO 302 Location: /formulario/):
#   curl -sI https://nexusqa.exelixitech.com/formulario/ | grep -iE '^HTTP|^Location'
#   curl -sI https://nexusqa.exelixitech.com/ocr/        | grep -iE '^HTTP|^Location'
#   curl -sI http://127.0.0.1:5182/formulario/ | head -1

<IfModule mod_ssl.c>
# Fragmento VirtualHost :443 — nexusqa.exelixitech.com

    ProxyPass        /ocr/         http://127.0.0.1:5181/ocr/
    ProxyPassReverse /ocr/         http://127.0.0.1:5181/ocr/

    ProxyPass        /formulario/  http://127.0.0.1:5182/formulario/
    ProxyPassReverse /formulario/  http://127.0.0.1:5182/formulario/

    ProxyPass        /emision/     http://127.0.0.1:5183/emision/
    ProxyPassReverse /emision/     http://127.0.0.1:5183/emision/

    ProxyPass        /pagos/       http://127.0.0.1:5184/pagos/
    ProxyPassReverse /pagos/       http://127.0.0.1:5184/pagos/

    ProxyPass        /nexus-api/   http://127.0.0.1:3092/
    ProxyPassReverse /nexus-api/   http://127.0.0.1:3092/

    ProxyPass        /admin/       http://127.0.0.1:5200/admin/
    ProxyPassReverse /admin/       http://127.0.0.1:5200/admin/

    ProxyPass        /nest-api-docs/  http://127.0.0.1:3002/
    ProxyPassReverse /nest-api-docs/  http://127.0.0.1:3002/

</IfModule>

# ❌ ELIMINAR si existen (provocan bucle 302):
#   ProxyPass /formulario/ http://127.0.0.1:5182/
#   ProxyPass /ocr/        http://127.0.0.1:5181/
#   ProxyPass /pagos/      http://127.0.0.1:5184/
